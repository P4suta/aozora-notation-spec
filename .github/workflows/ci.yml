name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip only GitHub Dependabot security PRs because their subjects and bodies exceed 50/72, while routine Mend-hosted Renovate PRs use Conventional Commit titles.
    # Guard on the PR *author*, not `github.actor`, so a maintainer `gh pr update-branch` on a bot PR does not flip the guard and fail the lint (P4suta/aozora#113).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # Lint only non-merge commits: `committed` flags any merge commit
      # ("Merge branch 'main' …") as "Missing type", so a maintainer
      # `gh pr update-branch` merge must not reach it (P4suta/aozora#113).
      # `committed` takes a single revspec, so feed SHAs one per
      # invocation (`-rn1`); a multi-commit PR would otherwise pass
      # several positionals at once and abort with "unexpected argument".
      - name: Check Conventional Commits (committed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" | xargs -rn1 committed

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise provisions typos + taplo (and the rest) from mise.toml.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Spell-check (typos)
        run: typos
      - name: TOML formatting (taplo)
        run: taplo fmt --check

  spec:
    name: spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise provisions mdBook (precompiled) + Python 3.12 from mise.toml,
      # so the job no longer compiles mdBook from source.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # Install from the pinned manifest so host == CI and Mend-hosted Renovate can track the Python dependencies under the shared P4suta policy.
      - name: Install Python deps
        run: pip install -r tools/requirements.txt

      - name: Validate conformance vectors
        run: python3 tools/validate_vectors.py

      - name: Check the ABNF grammar
        run: python3 tools/abnf_check.py src/grammar/aozora.abnf

      - name: Check cross-references
        run: python3 tools/linkcheck.py

      - name: Build the book
        run: mdbook build

  # A Release Please PR (labelled `autorelease: pending`) may merge only once a
  # maintainer adds `release: approved` — the deliberate "we are releasing" step.
  # Normal PRs (no `autorelease: pending`) pass unconditionally. Labels are read
  # live, so after labelling, re-run just this job to turn it green (no full CI
  # rerun). Required via the main-branch ruleset, so it actually blocks merge.
  release-gate:
    name: release-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # The gate reads the current pull request labels.
    steps:
      - name: "Require `release: approved` on a Release PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if grep -qx 'autorelease: pending' <<<"$labels"; then
            if grep -qx 'release: approved' <<<"$labels"; then
              echo "Release PR is approved — gate open."
            else
              echo "::error::Release PR (autorelease: pending) lacks the 'release: approved' label. Add it deliberately, then re-run this job."
              exit 1
            fi
          else
            echo "Not a Release PR — gate not applicable."
          fi

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [commitlint, lint, spec, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
