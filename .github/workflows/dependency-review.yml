# Dependency review on pull requests flags newly introduced advisories in the only tracked dependency surfaces this repository has: GitHub Actions and the pip tooling (`tools/requirements.txt`).
# It complements Mend-hosted Renovate updates by gating what every pull request adds.
#
# Action pinning uses full commit SHAs, and the `# vX.Y.Z` trailer is the resolved tag.
# Mend-hosted Renovate keeps them current under the shared P4suta policy.

name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          # Comment only on failure so clean PRs get no drive-by no-op.
          comment-summary-in-pr: on-failure
