# Build the spec with mdBook and publish it to GitHub Pages.
#
# Much simpler than a code repo's docs site: there is no API reference
# or playground to assemble — just `mdbook build` (mdBook is provisioned
# from mise.toml, exactly as in ci.yml) and a Pages deploy of ./book.
#
# Action pinning: every action is pinned to a full commit SHA (the
# `# vX` trailer is the resolved tag); Dependabot's github-actions
# ecosystem keeps the SHAs current.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy in flight at a time; queue the rest so we never partially
# overwrite the Pages bucket.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Build the book
        run: mdbook build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: book

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        id: deployment
